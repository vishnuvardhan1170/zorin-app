name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  update-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update image tag in gitops repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/vishnuvardhan1170/zorin-gitops.git gitops-repo
          cd gitops-repo
          yq -i '.image.repository = "asia-south1-docker.pkg.dev/your-gcp-project/zorin/zorin-app"' helm/values.yaml
          yq -i ".image.tag = \"${IMAGE_TAG}\"" helm/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git commit -m "chore: update zorin-app to ${IMAGE_TAG}"
          git push