name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/
      MONGO_DB: zorin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Dependency audit
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      # SAST
      - name: Bandit
        run: |
          pip install bandit
          bandit -r . -x tests/ -ll

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write       # enables token exchange
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)    # OIDC requires no AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/gh-oidc-zorin
          aws-region: us-east-1
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/zorin-app:${{ github.sha }} .
          docker tag ${{ steps.ecr.outputs.registry }}/zorin-app:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/zorin-app:latest
          docker push ${{ steps.ecr.outputs.registry }}/zorin-app:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/zorin-app:latest

# Create OIDC provider via AWS IAM Console
# Provider type as OpenID Connect
# Provider URL: https://token.actions.githubusercontent.com, Audience: sts.amazonaws.com

# Create IAM Role
# Trusted entity -> Web Identity -> OIDC provider -> audience: sts.amazonaws.com
# Attach ECR permissions -> select AmazonEC2ContainerRegistryPowerUser (for Dev) or ecr:GetAuthorizationToken (for production)


