name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: 

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Bandit
        run: |
          pip install bandit
          bandit -r . -x tests/ -ll

  build:
    needs: [lint, test, security-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build -t asia-south1-docker.pkg.dev/zorin-demo-514410/zorin/zorin-app:${{ github.sha }} .

      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: asia-south1-docker.pkg.dev/zorin-demo-514410/zorin/zorin-app:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push
        env:
          REGISTRY_KEY: ${{ secrets.DOCKER_REGISTRY_KEY }}
        run: |
          echo "$REGISTRY_KEY" | docker login -u _json_key --password-stdin asia-south1-docker.pkg.dev
          docker push asia-south1-docker.pkg.dev/zorin-demo-514410/zorin/zorin-app:${{ github.sha }}




