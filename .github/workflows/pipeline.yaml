name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Bandit
        run: |
          pip install bandit
          bandit -r . -x tests/ -ll

  build:
    needs: [lint, test, security-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: zorin-demo-514410
          workload_identity_provider: "projects/927186636170/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "927186636170-compute@developer.gserviceaccount.com"

      - name: Build
        run: |
          echo '{"username":"_json_key","password":"'"$(cat "${GOOGLE_APPLICATION_CREDENTIALS}")"'"}' | \
            docker login asia-south1-docker.pkg.dev -u _json_key --password-stdin
          docker build -t asia-south1-docker.pkg.dev/zorin-demo-514410/zorin/zorin-app:${{ github.sha }} .

      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: asia-south1-docker.pkg.dev/zorin-demo-514410/zorin/zorin-app:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push
        run: docker push asia-south1-docker.pkg.dev/zorin-demo-514410/zorin/zorin-app:${{ github.sha }}


